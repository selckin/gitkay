name: Release

on:
  # Cut a release from the Actions tab. This path does the version bump ITSELF,
  # which is the whole point of it: the .rpm/.deb version comes from the tag, so
  # a tag pushed ahead of the committed version sites ships packages labelled
  # one version around a binary reporting another — v0.0.1..v0.0.4 all shipped
  # `gitkay 1.2.0`, and the `version` job below exists because that is silent.
  # Bumping, building and tagging in one run removes the step that has to be
  # remembered rather than making it fail faster.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.0.7)"
        required: true
        type: string

  # MAJOR.MINOR.PATCH only, matching set-version.sh's --check exactly. Under
  # the old "v*" a pre-release tag started a run the version gate then failed,
  # producing no artifacts at all where it once produced a release; a
  # pre-release would need an rpm Release: field and a deb `~rc` version,
  # which nothing here builds. Keep the two in step.
  #
  # This trigger is still the hand-tagged path, kept because the dispatch above
  # cannot serve a tag that already exists — and because it is what the
  # `--check` gate was written for.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time. Two dispatches would compute their bumps from the same
# base and both build to completion, and the loser's push would then be refused
# as a non-fast-forward — a full build spent to learn that. Never cancel a run
# in progress: the only window where a cancel could do damage is between the
# push and the release, and that is precisely the state this file is arranged
# to never leave behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Set & verify version
    runs-on: ubuntu-latest
    # Reads only. This job COMPUTES the bump and hands it on as a patch; the
    # release job is the only one that writes anything anywhere, and only once
    # every build has passed.
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      bump: ${{ steps.resolve.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          # set-version.sh generates both changelog bodies from the commit
          # subjects since the previous release, and finds that release by
          # `git rev-parse refs/tags/v<previous>` — so it needs the tags and
          # the history, not a shallow tip.
          fetch-depth: 0
          persist-credentials: false

      # set-version.sh rewrites Cargo.lock through `cargo update -p gitkay
      # --offline`, and offline resolution reads the registry INDEX cache — which
      # on a fresh runner is empty, so the resolve fails on the first dependency
      # ("no matching package named `arboard` found") and takes the whole
      # dispatch down before a single job has built. `cargo fetch` is what fills
      # it; ci.yml gets there by caching ~/.cargo/registry, which this job has no
      # reason to keep. Only the dispatch path writes Cargo.lock, so only it pays.
      #
      # The toolchain is pinned as the build jobs pin theirs rather than left to
      # whatever the image ships: the lock file written here is the one those
      # jobs then have to accept under --locked.
      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Warm the cargo registry
        if: github.event_name == 'workflow_dispatch'
        run: cargo fetch --locked

      # The bump has to be computed BEFORE anything is built: the binary
      # reports CARGO_PKG_VERSION, so a build from the pre-bump tree is the
      # exact drift the check below catches — arriving from inside the workflow
      # instead of from a hand-pushed tag. Computed here, applied by every job
      # that builds, and COMMITTED only by the release job at the end.
      - name: Resolve the version to release
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          die() { echo "::error::$*"; exit 1; }

          bump=false
          if [ "$EVENT" = workflow_dispatch ]; then
            version=$INPUT_VERSION
            case "$GITHUB_REF" in
              refs/heads/*) ;;
              *) die "run this from a branch: a bump commit pushed to '$GITHUB_REF' has nowhere to land" ;;
            esac
            # A release comes from the branch everything is merged into, and
            # nowhere else. This path ends by pushing a commit and tagging it,
            # so a run from a side branch publishes a version built from
            # unreviewed work — and workflow_dispatch takes the WORKFLOW FILE
            # from the selected ref as well, so without this the dispatch is
            # also the route around whatever the default branch requires. Read
            # from the repository rather than written here, or renaming the
            # branch leaves a guard naming one that no longer exists.
            [ -n "$DEFAULT_BRANCH" ] || die "cannot read the repository's default branch"
            [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] \
              || die "releases are cut from $DEFAULT_BRANCH, not '$GITHUB_REF_NAME'; merge first, then dispatch"
            # An existing tag would be moved by the release job's --target, so
            # refuse rather than silently re-point a published release.
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              die "tag v$version already exists; delete it (git push <remote> :refs/tags/v$version) or pick another version"
            fi

            # A tree that already says this version is a release of what is on
            # the branch, not an error: it is what the hand flow leaves behind
            # (set-version.sh, commit, no tag). Nothing to apply, nothing to
            # commit — the release job just tags this sha.
            if ./packaging/set-version.sh --check "$version" >/dev/null 2>&1; then
              echo "every version site already says $version — releasing $GITHUB_REF_NAME as it stands"
            else
              ./packaging/set-version.sh "$version" || die "cannot set the version"
              # ONE generation of the changelog bodies, handed on verbatim. Each
              # job re-running set-version.sh would be simpler to wire and wrong:
              # the entries are stamped with `date -R`, so the tree that compiled
              # and the tree that gets committed would differ.
              git diff > version-bump.patch || die "cannot write the version-bump patch"
              [ -s version-bump.patch ] || die "set-version.sh reported success and changed nothing"
              bump=true
            fi
          else
            version=${REF_NAME#v}
          fi

          # The sha every other job checks out. On the dispatch path the bump
          # is not in it — it rides alongside as the patch above.
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$GITHUB_SHA"
            echo "bump=$bump"
          } >> "$GITHUB_OUTPUT"

      # The .rpm and .deb take their version from the tag, so the committed
      # version sites drifting from it is otherwise SILENT: v0.0.1..v0.0.4 all
      # shipped a binary reporting `gitkay 1.2.0`. Everything else needs this
      # job, so a mismatched tag costs seconds instead of a bad release. It
      # runs on both paths — on the dispatch path it verifies what the step
      # above just wrote, which is what turns "the script ran" into "the tree
      # says so".
      - name: Check the tag matches every version site
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: ./packaging/set-version.sh --check "$VERSION"

      - name: Upload the version bump
        if: steps.resolve.outputs.bump == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: version-bump
          path: version-bump.patch

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: gitkay
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: gitkay

    steps:
      # Every job checks out the resolved SHA rather than the triggering ref:
      # on the dispatch path the ref is the branch as it stood BEFORE the bump,
      # so a plain checkout would build the version the release is moving off.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Apply the pending version bump
        if: needs.version.outputs.bump == 'true'
        uses: ./.github/actions/apply-version-bump
        with:
          sha: ${{ needs.version.outputs.sha }}

      # The version job's own check fails fast, before any runner is spun up.
      # This is the one on the tree that actually COMPILES, which is where
      # CARGO_PKG_VERSION comes from — the reconstructed tree, on the dispatch
      # path, rather than a checkout anyone can look at.
      - name: Check the tree being built says the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/set-version.sh --check "$VERSION"

      - name: Install system dependencies
        run: |
          # libgit2-sys compiles the bundled libgit2 with cc (not cmake) and
          # probes with pkg-config; nothing in the tree links GTK, graphene or
          # OpenSSL (git2 is built with default-features = []).
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package binary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd target/release
          tar czf "../../gitkay-${TAG}-${{ matrix.target }}.tar.gz" gitkay

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitkay-${{ matrix.target }}
          path: gitkay-*-${{ matrix.target }}.tar.gz

  rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Apply the pending version bump
        if: needs.version.outputs.bump == 'true'
        uses: ./.github/actions/apply-version-bump
        with:
          sha: ${{ needs.version.outputs.sha }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: gitkay-x86_64-unknown-linux-gnu

      - name: Build RPM
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          die() { echo "::error::$*"; exit 1; }
          sudo apt-get update || die "apt-get update failed"
          sudo apt-get install -y rpm || die "cannot install rpm"
          # The repack spec, and every dependency in it, is derived from
          # packaging/gitkay.spec by the script — which is why neither lives
          # here any more. See packaging/build-rpm.sh for what that buys.
          ./packaging/build-rpm.sh "$VERSION" \
            "gitkay-${TAG}-x86_64-unknown-linux-gnu.tar.gz" dist \
            || die "the rpm repack failed"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: gitkay-rpm
          path: dist/*.rpm

  deb:
    name: Build deb
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Apply the pending version bump
        if: needs.version.outputs.bump == 'true'
        uses: ./.github/actions/apply-version-bump
        with:
          sha: ${{ needs.version.outputs.sha }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: gitkay-x86_64-unknown-linux-gnu

      - name: Build deb
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          die() { echo "::error::$*"; exit 1; }
          sudo apt-get update || die "apt-get update failed"
          sudo apt-get install -y dpkg-dev || die "cannot install dpkg-dev"
          # Depends is computed from the ELF and merged with the dlopen'd
          # libraries stated in packaging/debian/control, which the script reads
          # rather than restates. See packaging/build-deb.sh.
          ./packaging/build-deb.sh "$VERSION" \
            "gitkay-${TAG}-x86_64-unknown-linux-gnu.tar.gz" dist \
            || die "the deb repack failed"

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: gitkay-deb
          path: dist/*.deb

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build, rpm, deb]
    permissions:
      contents: write
    steps:
      # The ONLY checkout in this file that carries credentials, in the only
      # job that writes anything. Everything above ran read-only, which is what
      # deferring the push buys beyond the tidier failure mode: the jobs that
      # compile third-party build scripts hold no token that could push.
      #
      # Ahead of the artifact download, since checkout cleans the workspace.
      # Full history: pushing from a shallow clone is refused.
      - uses: actions/checkout@v7
        if: needs.version.outputs.bump == 'true'
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          cp artifacts/gitkay-x86_64-unknown-linux-gnu/*.tar.gz release/
          cp artifacts/gitkay-aarch64-unknown-linux-gnu/*.tar.gz release/
          cp artifacts/gitkay-rpm/*.rpm release/
          cp artifacts/gitkay-deb/*.deb release/
          ls -la release/
          for ext in tar.gz rpm deb; do
            ls release/*."$ext" >/dev/null || { echo "::error::no .$ext artifact in release/"; exit 1; }
          done

      # EVERY WRITE HAPPENS FROM HERE DOWN, and only now: both targets built,
      # both test suites passed, both packages repacked. Until this step the
      # branch has never moved and no tag exists, so a failure anywhere above
      # leaves the repository exactly as it was — nothing to clean up, nothing
      # half-released, and re-dispatching the same version is simply the same
      # run again.
      - name: Push the version bump
        if: needs.version.outputs.bump == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          die() { echo "::error::$*"; exit 1; }

          # The maintainer comes from debian/control for the same reason
          # set-version.sh takes the changelog signoffs from there: one
          # statement of who releases this, not two that can drift.
          maintainer=$(sed -n 's/^Maintainer: //p' packaging/debian/control)
          [ -n "$maintainer" ] || die "no Maintainer: in packaging/debian/control"
          email=${maintainer#*<}
          git config user.name "${maintainer%% <*}" || die "cannot set the commit author"
          git config user.email "${email%>}" || die "cannot set the commit email"

          git apply artifacts/version-bump/version-bump.patch \
            || die "the version bump no longer applies"
          # The same check the build jobs ran on the tree they compiled, now on
          # the tree about to be committed. It is the only thing tying the two
          # together: they were reconstructed from this patch independently.
          ./packaging/set-version.sh --check "$VERSION" \
            || die "the reconstructed tree does not say $VERSION"
          # `git add -u`, NOT the five paths spelled out: set-version.sh owns
          # where the version lives, and a sixth site added there would be
          # applied by the patch above and then silently left out of the commit —
          # a pushed tag whose tree is half-bumped, and a --check that fails on a
          # branch nobody touched. The patch is the only thing that modified a
          # tracked file in this workspace, so -u stages exactly it.
          git add -u || die "cannot stage the version bump"
          git commit -m "release: v$VERSION" || die "cannot commit the version bump"

          # Not forced. A branch that moved while this was building means the
          # artifacts above were built from a tree that is no longer its tip,
          # and publishing them as that tip would be a lie; re-dispatch instead.
          # A push made with GITHUB_TOKEN starts no further runs, so CI does not
          # see this commit — the build job compiled and tested this exact tree.
          git push origin "HEAD:refs/heads/$BRANCH" \
            || die "cannot fast-forward $BRANCH (did it move?); re-dispatch $VERSION"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The TAG IS CREATED HERE, by the release itself: `gh release create
      # --target` makes it at the commit pushed just above (a lightweight tag,
      # as every existing one is). On the hand-tagged path the tag is already
      # there and --target is ignored.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          BUMPED: ${{ needs.version.outputs.bump }}
        run: |
          die() { echo "::error::$*"; exit 1; }

          # Which commit the tag names is decided by whether a bump was PUSHED,
          # not by whether a variable happens to be set. `${RELEASE_SHA:-$SHA}`
          # reads an unset RELEASE_SHA as "no bump was pushed" — and the step
          # above sets it through `echo "RELEASE_SHA=$(git rev-parse HEAD)"`,
          # where the substitution failing leaves echo exiting 0 and the value
          # empty. The tag would then be created at the PRE-bump commit: a
          # published release whose tree reports the version this run was moving
          # off, which is exactly the drift the version job exists to make loud.
          if [ "$BUMPED" = true ]; then
            [ -n "$RELEASE_SHA" ] || die "the bump was pushed but its sha was never recorded"
            target=$RELEASE_SHA
          else
            target=$SHA
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$target" --notes ""
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
